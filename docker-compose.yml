  nginx:
    image: nginx:latest
    container_name: nginx
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - /Users/maksimbilyk/RiderProjects/MegaMonster/Nginx/certs:/etc/nginx/certs:ro
      - /Users/maksimbilyk/RiderProjects/MegaMonster/Nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - megamonster.services.auth
      - megamonster.services.card
      - megamonster.services.favors
      - megamonster.services.notification
      - megamonster.services.payment
      - megamonster.services.user
    networks:
      - app_network

networks:
  app_network:
    driver: bridge