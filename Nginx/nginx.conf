worker_processes 1;

events {
    worker_connections 1024;
}

http {
    include mime.types;
    default_type application/octet-stream;

    sendfile on;
    keepalive_timeout 65;

    upstream auth-service {
        server megamonster-megamonster.services.auth-1:8081;
    }
    
    upstream card-service {
            server megamonster-megamonster.services.card-1:8087;
    }
    
    upstream favors-service {
            server megamonster-megamonster.services.favors-1:8089;
    }
    
    upstream notification-service {
            server megamonster-megamonster.services.notification-1:8085;
    }
        
    upstream payment-service {
            server megamonster-megamonster.services.payment-1:8091;
    }
        
    upstream user-service {
             server megamonster-megamonster.services.user-1:8083;
    }

    server {
        listen 80;
        server_name localhost;
        return 301 https://$host$request_uri;
    }

    server {
        listen 443 ssl;
        server_name localhost;

        ssl_certificate /etc/nginx/certs/example.crt;
        ssl_certificate_key /etc/nginx/certs/example.key;

        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_ciphers HIGH:!aNULL:!MD5;
        ssl_prefer_server_ciphers on;

        location /auth/ {
            proxy_pass https://auth-service/api/auth/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_redirect off;
            proxy_ssl_verify off;
        }
        
        location /card/ {
                    proxy_pass https://card-service/api/card/;
                    proxy_set_header Host $host;
                    proxy_set_header X-Real-IP $remote_addr;
                    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
                    proxy_set_header X-Forwarded-Proto $scheme;
                    proxy_redirect off;
                    proxy_ssl_verify off;
        }
        
        location /favors/ {
                    proxy_pass https://favors-service/api/Favors/;
                    proxy_set_header Host $host;
                    proxy_set_header X-Real-IP $remote_addr;
                    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
                    proxy_set_header X-Forwarded-Proto $scheme;
                    proxy_redirect off;
                    proxy_ssl_verify off;
        }
        
        location /notification/ {
                    proxy_pass https://notification-service/api/notification/;
                    proxy_set_header Host $host;
                    proxy_set_header X-Real-IP $remote_addr;
                    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
                    proxy_set_header X-Forwarded-Proto $scheme;
                    proxy_redirect off;
                    proxy_ssl_verify off;
        }
        
        location /payment/ {
                    proxy_pass https://payment-service/api/payment/;
                    proxy_set_header Host $host;
                    proxy_set_header X-Real-IP $remote_addr;
                    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
                    proxy_set_header X-Forwarded-Proto $scheme;
                    proxy_redirect off;
                    proxy_ssl_verify off;
        }
        
        location /user/ {
                    proxy_pass https://user-service/api/users/;
                    proxy_set_header Host $host;
                    proxy_set_header X-Real-IP $remote_addr;
                    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
                    proxy_set_header X-Forwarded-Proto $scheme;
                    proxy_redirect off;
                    proxy_ssl_verify off;
        }

        location /static/ {
            root /path/to/static/files;
        }

        error_page 500 502 503 504 /50x.html;
        location = /50x.html {
            root html;
        }

        error_log /var/log/nginx/error.log warn;
        access_log /var/log/nginx/access.log;
    }
}