<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Order Invoice</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            font-family: 'Roboto', Arial, sans-serif;
            background-color: #f3f4f6;
        }

        .email-wrapper {
            width: 100%;
            max-width: 600px;
            margin: 20px auto;
            background-color: #ffffff;
            border-radius: 12px;
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.15);
            overflow: hidden;
            border: 4px solid #ffa726;
        }

        .header {
            background: linear-gradient(135deg, #ff6f61, #ffa726);
            padding: 30px;
            text-align: center;
            color: #ffffff;
            font-size: 26px;
            font-weight: bold;
        }

        .content {
            padding: 30px;
            color: #333333;
            text-align: center;
        }

        .customer-details {
            font-size: 18px;
            color: #333333;
            margin-bottom: 20px;
            text-align: left;
        }

        .bill-section {
            margin-top: 20px;
            text-align: left;
            background-color: #f1f3f5;
            padding: 15px;
            border-radius: 8px;
            border: 1px solid #e9ecef;
        }

        .bill-section table {
            width: 100%;
            border-collapse: collapse;
        }

        .bill-section th,
        .bill-section td {
            padding: 10px;
            text-align: left;
            border-bottom: 1px solid #ddd;
        }

        .bill-section th {
            background-color: #ffa726;
            color: #ffffff;
        }

        .total {
            font-weight: bold;
            color: #ff6f61;
            text-align: right;
        }

        .footer {
            background-color: #ffa726;
            padding: 15px;
            text-align: center;
            color: #ffffff;
            font-size: 14px;
        }
    </style>
</head>

<body>
<div class="email-wrapper">
    <div class="header">
        Order Invoice 🧾
    </div>
    <div class="content">
        <h1>Order Details</h1>
        <div class="customer-details">
            <p><strong>Customer Name: </strong> {UserName}</p>
            <p><strong>Order ID: </strong> {OrderId}</p>
            <p><strong>Payment Type: </strong> {PaymentType}</p>
            <p><strong>Status: </strong> {Status}</p>
        </div>

        <h1>Bill Summary</h1>
        <div class="bill-section">
            <table>
                <thead>
                <tr>
                    <th>Ticket ID</th>
                </tr>
                </thead>
                <tbody>
                {OrderDetailsRows}
                </tbody>
                <tfoot>
                <tr>
                    <td class="total" colspan="2">Total: ₴{Sum}</td>
                </tr>
                </tfoot>
            </table>
        </div>
    </div>
    <div class="footer">
        &copy; 2024 Mega Monster Pavers. All rights reserved.
    </div>
</div>
</body>

</html>
